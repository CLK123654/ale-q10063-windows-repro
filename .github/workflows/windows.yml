name: windows-2025-sqlite-reproduction

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Configure Git TLS backend
        shell: pwsh
        run: git config --global http.sslBackend openssl

      - uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SQLite 3.53.4
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sqlite-tools.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'sqlite-tools'
          Invoke-WebRequest -Uri 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $sqlite = Get-ChildItem -LiteralPath $destination -Filter sqlite3.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $sqlite) { throw 'sqlite3.exe not found' }
          $sqlite.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $sqlite.FullName --version

      - name: Run independent Windows gate
        shell: pwsh
        run: |
          ./scripts/windows_gate.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'ale-evidence')

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-evidence
          path: ${{ runner.temp }}/ale-evidence
          if-no-files-found: error
          retention-days: 30
